name: Release

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: 'Minecraft version to release (a directory under versions/). Leave empty to release every version.'
        required: false
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - pre-release
        default: 'release'
      release_notes:
        description: 'Additional release notes (optional)'
        required: false
        type: string
      publish_modrinth:
        description: 'Publish to Modrinth'
        required: true
        type: boolean
        default: true

# Only allow one release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    # Only run on main branch
    if: github.ref == 'refs/heads/main'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      latest: ${{ steps.list.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List Minecraft versions
        id: list
        env:
          REQUESTED: ${{ inputs.minecraft_version }}
        run: |
          # One directory per supported Minecraft version
          if [ -n "$REQUESTED" ]; then
            if [ ! -f "versions/$REQUESTED/gradle.properties" ]; then
              echo "::error::No versions/$REQUESTED/gradle.properties; supported versions: $(ls versions | tr '\n' ' ')"
              exit 1
            fi
            echo "matrix=$(jq -cn --arg v "$REQUESTED" '[$v]')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(ls versions | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi
          echo "latest=$(ls versions | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

  release:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      # A failed version can be re-run on its own through the minecraft_version input
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Java version
        id: java
        run: |
          JAVA_VERSION=$(grep -E '^\s*java_version\s*=' gradle.properties | sed 's/.*=\s*//' | tr -d '[:space:]')
          if [ -z "$JAVA_VERSION" ]; then
            echo "::error::Could not determine Java version from gradle.properties"
            exit 1
          fi
          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version information
        id: version
        run: |
          # Read mod version from gradle.properties
          MOD_VERSION=$(grep -E '^\s*mod_version\s*=' gradle.properties | sed 's/.*=\s*//' | tr -d '[:space:]')
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

          MC_VERSION="${{ matrix.minecraft }}"
          echo "minecraft_version=$MC_VERSION" >> "$GITHUB_OUTPUT"

          # Read other properties; the Fabric API version and the Minecraft range are per Minecraft version
          FABRIC_LOADER=$(grep -E '^\s*loader_version\s*=' gradle.properties | sed 's/.*=\s*//' | tr -d '[:space:]')
          FABRIC_API=$(grep -E '^\s*fabric_version\s*=' "versions/$MC_VERSION/gradle.properties" | sed 's/.*=\s*//' | tr -d '[:space:]')
          MC_DEPENDENCY=$(grep -E '^\s*minecraft_dependency\s*=' "versions/$MC_VERSION/gradle.properties" | sed 's/.*=\s*//' | tr -d '[:space:]')
          echo "fabric_loader=$FABRIC_LOADER" >> "$GITHUB_OUTPUT"
          echo "fabric_api=$FABRIC_API" >> "$GITHUB_OUTPUT"
          echo "minecraft_dependency=$MC_DEPENDENCY" >> "$GITHUB_OUTPUT"

          # Build date stamp (yyMMdd)
          BUILD_DATE=$(date +%y%m%d)
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          # Full version string: minecraft_version-mod_version+vyyMMdd
          FULL_VERSION="${MC_VERSION}-${MOD_VERSION}+v${BUILD_DATE}"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

          # Tag name
          TAG_NAME="v${FULL_VERSION}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "=== Version Summary ==="
          echo "Carpet PvP Version: $MOD_VERSION"
          echo "Minecraft Version:  $MC_VERSION"
          echo "Fabric Loader:      $FABRIC_LOADER"
          echo "Fabric API:         $FABRIC_API"
          echo "Full Version:       $FULL_VERSION"
          echo "Tag:                $TAG_NAME"

      - name: Validate version info
        run: |
          if [ -z "${{ steps.version.outputs.mod_version }}" ]; then
            echo "::error::Could not determine Carpet PvP mod version from gradle.properties"
            exit 1
          fi
          if [ -z "${{ steps.version.outputs.minecraft_version }}" ]; then
            echo "::error::Could not determine Minecraft version"
            exit 1
          fi
          if [ -z "${{ steps.version.outputs.minecraft_dependency }}" ]; then
            echo "::error::Could not determine the Minecraft range of versions/${{ matrix.minecraft }}/gradle.properties"
            exit 1
          fi
          echo "Version validation passed."

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "::error::Tag $TAG already exists. A release for this version was already created today."
            exit 1
          fi

      - name: Build
        run: ./gradlew --no-daemon ":${{ matrix.minecraft }}:build" -x test

      - name: Identify built artifacts
        id: artifacts
        run: |
          # Find the main jar (exclude sources and dev jars)
          LIBS="versions/${{ matrix.minecraft }}/build/libs"
          MAIN_JAR=$(find "$LIBS" -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -1)
          SOURCES_JAR=$(find "$LIBS" -name "*-sources.jar" | head -1)

          if [ -z "$MAIN_JAR" ]; then
            echo "::error::No build artifact found in $LIBS"
            exit 1
          fi

          # The jar carries the Minecraft version of its node in its own name, so the three releases
          # can never be confused with each other
          case "$(basename "$MAIN_JAR")" in
            *"${{ matrix.minecraft }}"*) ;;
            *) echo "::error::$(basename "$MAIN_JAR") is not a ${{ matrix.minecraft }} jar"; exit 1 ;;
          esac

          echo "main_jar=$MAIN_JAR" >> "$GITHUB_OUTPUT"
          echo "main_jar_name=$(basename "$MAIN_JAR")" >> "$GITHUB_OUTPUT"

          if [ -n "$SOURCES_JAR" ]; then
            echo "sources_jar=$SOURCES_JAR" >> "$GITHUB_OUTPUT"
            echo "sources_jar_name=$(basename "$SOURCES_JAR")" >> "$GITHUB_OUTPUT"
            echo "has_sources=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sources=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== Artifacts ==="
          ls -lh "$LIBS"

      - name: Generate release notes
        id: notes
        run: |
          NOTES_FILE=$(mktemp)
          {
            echo "## Carpet PvP ${{ steps.version.outputs.full_version }}"
            echo ""
            echo "### Version Info"
            echo "| Component | Version |"
            echo "|-----------|---------|"
            echo "| **Carpet PvP** | ${{ steps.version.outputs.mod_version }} |"
            echo "| **Minecraft** | ${{ steps.version.outputs.minecraft_version }} (`${{ steps.version.outputs.minecraft_dependency }}`) |"
            echo "| **Fabric Loader** | ${{ steps.version.outputs.fabric_loader }} |"
            echo "| **Fabric API** | ${{ steps.version.outputs.fabric_api }} |"
            echo "| **Java** | ${{ steps.java.outputs.version }}+ |"
            echo ""
            if [ -n "${{ inputs.release_notes }}" ]; then
              echo "### Release Notes"
              echo "${{ inputs.release_notes }}"
              echo ""
            fi
            echo "### Installation"
            echo "1. Install [Fabric Loader](https://fabricmc.net/use/) (${{ steps.version.outputs.fabric_loader }}+) for Minecraft ${{ steps.version.outputs.minecraft_version }}"
            echo "2. Install [Fabric API](https://modrinth.com/mod/fabric-api) (${{ steps.version.outputs.fabric_api }}+)"
            echo "3. Place \`${{ steps.artifacts.outputs.main_jar_name }}\` in your \`mods\` folder"
            echo ""
            echo "---"
            echo "*Built from [\`$(git rev-parse --short HEAD)\`](https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)) on $(date -u +"%Y-%m-%d %H:%M UTC")*"
          } > "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Carpet PvP ${{ steps.version.outputs.full_version }}"
          body_path: ${{ steps.notes.outputs.notes_file }}
          prerelease: ${{ inputs.release_type == 'pre-release' }}
          draft: false
          generate_release_notes: false
          make_latest: ${{ inputs.release_type == 'release' && matrix.minecraft == needs.versions.outputs.latest }}
          files: |
            ${{ steps.artifacts.outputs.main_jar }}
            ${{ steps.artifacts.outputs.sources_jar }}
          fail_on_unmatched_files: false

      - name: Publish to Modrinth
        if: inputs.publish_modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: ${{ steps.artifacts.outputs.main_jar }}

          name: "Carpet PvP ${{ steps.version.outputs.full_version }}"
          version: ${{ steps.version.outputs.full_version }}
          version-type: ${{ inputs.release_type == 'pre-release' && 'beta' || 'release' }}
          changelog-file: ${{ steps.notes.outputs.notes_file }}

          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft_version }}
          dependencies: |
            fabric-api@${{ steps.version.outputs.fabric_api }}(required)
